spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DAMAI_MYSQL_HOST:127.0.0.1}:${DAMAI_MYSQL_PORT:13306}/damai_customize?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowMultiQueries=true&serverTimezone=Asia/Shanghai
    username: ${DAMAI_MYSQL_USERNAME:root}
    password: ${DAMAI_MYSQL_PASSWORD:root}
    hikari:
      max-lifetime: 60000
