global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "damai-services"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:6080
          - host.docker.internal:6081
          - host.docker.internal:6082
          - host.docker.internal:6083
          - host.docker.internal:6084
          - host.docker.internal:6085
          - host.docker.internal:6086
          - host.docker.internal:6087
          - host.docker.internal:6088
          - host.docker.internal:6089

  - job_name: "otel-collector"
    static_configs:
      - targets:
          - otel-collector:8889

