server:
  port: ${DAMAI_AI_PORT:6089}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  application:
    name: damai-ai
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
    jackson:
      time-zone: GMT+8
      date-format: yyyy-MM-dd HH:mm:ss
      generator:
        WRITE_NUMBERS_AS_STRINGS: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DAMAI_AI_MYSQL_URL:jdbc:mysql://${DAMAI_MYSQL_HOST:127.0.0.1}:${DAMAI_MYSQL_PORT:13306}/damai_ai?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&tinyInt1isBit=false&allowPublicKeyRetrieval=true&allowMultiQueries=true&useServerPrepStmts=false}
    username: ${DAMAI_AI_MYSQL_USERNAME:${DAMAI_MYSQL_USERNAME:root}}
    password: ${DAMAI_AI_MYSQL_PASSWORD:${DAMAI_MYSQL_PASSWORD:root}}
  rabbitmq:
    host: ${DAMAI_RABBITMQ_HOST:127.0.0.1}
    port: ${DAMAI_RABBITMQ_AMQP_PORT:5672}
    username: ${DAMAI_RABBITMQ_USERNAME:damai}
    password: ${DAMAI_RABBITMQ_PASSWORD:damai}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
  data:
    redis:
      host: ${DAMAI_REDIS_HOST:127.0.0.1}
      port: ${DAMAI_REDIS_PORT:16379}
      password: ${DAMAI_REDIS_PASSWORD:}
      database: ${DAMAI_REDIS_DATABASE:0}
      timeout: ${DAMAI_REDIS_TIMEOUT:3000ms}
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
            platform: mariadb
    ollama:
      base-url: ${DAMAI_AI_OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        model: ${DAMAI_AI_OLLAMA_CHAT_MODEL:deepseek-r1:7b}
    openai:
      base-url: ${DAMAI_AI_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${DAMAI_AI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DAMAI_AI_OPENAI_CHAT_MODEL:deepseek-v4-pro}
      embedding:
        base-url: ${DAMAI_AI_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
        api-key: ${DAMAI_AI_EMBEDDING_API_KEY:${DAMAI_AI_ALIBABA_API_KEY:}}
        options:
          model: ${DAMAI_AI_OPENAI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${DAMAI_AI_OPENAI_EMBEDDING_DIMENSIONS:1024}
    deepseek:
      base-url: ${DAMAI_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DAMAI_AI_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DAMAI_AI_DEEPSEEK_CHAT_MODEL:deepseek-chat}
    mcp:
      client:
        sse:
          connections: {}
      server:
        enabled: ${DAMAI_AI_MCP_SERVER_ENABLED:false}
        stdio: true
        name: damai-ai
        version: 1.0.0
        instructions: |
          大麦票务平台 AI 运维助手。提供以下工具：
          - 日志查询：关键词搜索、traceId 链路追踪、错误日志、日志统计
          - 指标监控：JVM 内存、CPU 使用率、GC 指标、服务健康概览
          - 数据查询：NL2SQL 自然语言转 SQL 查询数据库
        tool-change-notification: true
easy-es:
  #默认为true,若为false则认为不启用本框架
  enable: true
  # es的连接地址,必须含端口
  address : ${DAMAI_ES_ADDR:127.0.0.1:19200}
  #账号,若无 则可省略此行配置
  username: ${DAMAI_ES_USERNAME:elastic}
  #密码,若无 则可省略此行配置
  password: ${DAMAI_ES_PASSWORD:elastic}
  global-config:
    db-config:
      #索引前缀
      index-prefix: damai-
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement  
management:
  metrics:
    tags:
      application: damai-ai
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
  health:
    elasticsearch:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true
damai:
  pro:
    internal-token: ${DAMAI_INTERNAL_ACCESS_TOKEN:}
    allow-unsafe-no-verify-fallback: ${DAMAI_ALLOW_UNSAFE_NO_VERIFY_FALLBACK:false}
  ai:
    eval:
      degraded-mode: ${DAMAI_AI_EVAL_DEGRADED_MODE:false}
      recall-at-k-threshold: ${DAMAI_AI_EVAL_RECALL_THRESHOLD:0.85}
      mrr-threshold: ${DAMAI_AI_EVAL_MRR_THRESHOLD:0.75}
      ndcg-at-k-threshold: ${DAMAI_AI_EVAL_NDCG_THRESHOLD:0.80}
      context-precision-threshold: ${DAMAI_AI_EVAL_CONTEXT_PRECISION_THRESHOLD:0.75}
      context-recall-threshold: ${DAMAI_AI_EVAL_CONTEXT_RECALL_THRESHOLD:0.75}
      context-relevance-threshold: ${DAMAI_AI_EVAL_CONTEXT_RELEVANCE_THRESHOLD:0.70}
      faithfulness-threshold: ${DAMAI_AI_EVAL_FAITHFULNESS_THRESHOLD:0.90}
      answer-relevancy-threshold: ${DAMAI_AI_EVAL_ANSWER_RELEVANCY_THRESHOLD:0.80}
      answer-correctness-threshold: ${DAMAI_AI_EVAL_ANSWER_CORRECTNESS_THRESHOLD:0.75}
    security:
      admin-user-ids: ${DAMAI_AI_ADMIN_USER_IDS:}
    mcp:
      governance:
        enabled: ${DAMAI_AI_MCP_GOVERNANCE_ENABLED:true}
        require-admin: ${DAMAI_AI_MCP_REQUIRE_ADMIN:true}
        require-high-risk-confirmation: ${DAMAI_AI_MCP_REQUIRE_HIGH_RISK_CONFIRMATION:true}
        expose-nl2sql: ${DAMAI_AI_MCP_EXPOSE_NL2SQL:false}
        allowlist: ${DAMAI_AI_MCP_ALLOWLIST:log.getServiceList,log.searchLogsByKeyword,log.getLogsByTraceId,log.getLatestLogs,log.getErrorLogs,log.getWarnLogs,log.getLogStatistics,log.searchLogsByClass,metrics.getMetricsServiceList,metrics.getJvmMemory,metrics.getCpuMetrics,metrics.getServiceHealthOverview,metrics.getAllServicesHealth}
        resource-allowlist: ${DAMAI_AI_MCP_RESOURCE_ALLOWLIST:observability://logs/services,observability://metrics/services,observability://traces/{traceId},assistant://runs/{runId}/graph}
        prompt-allowlist: ${DAMAI_AI_MCP_PROMPT_ALLOWLIST:ops.rca,ops.log-diagnosis,ops.metrics-diagnosis}
        high-risk-tools: ${DAMAI_AI_MCP_HIGH_RISK_TOOLS:nl2sql.nl2sqlQuery}
        high-risk-resources: ${DAMAI_AI_MCP_HIGH_RISK_RESOURCES:assistant://runs/{runId}/graph}
        high-risk-prompts: ${DAMAI_AI_MCP_HIGH_RISK_PROMPTS:ops.rca}
    web-search:
      enabled: ${DAMAI_AI_WEB_SEARCH_ENABLED:true}
      timeout-ms: ${DAMAI_AI_WEB_SEARCH_TIMEOUT_MS:5000}
      max-results: ${DAMAI_AI_WEB_SEARCH_MAX_RESULTS:5}
      tavily:
        enabled: ${DAMAI_AI_TAVILY_ENABLED:true}
        api-key: ${DAMAI_AI_TAVILY_API_KEY:}
        api-keys: ${DAMAI_AI_TAVILY_API_KEYS:}
        url: ${DAMAI_AI_TAVILY_URL:https://api.tavily.com/search}
      bocha:
        enabled: ${DAMAI_AI_BOCHA_ENABLED:true}
        api-key: ${DAMAI_AI_BOCHA_API_KEY:}
        url: ${DAMAI_AI_BOCHA_URL:https://api.bochaai.com/v1/web-search}
    rerank:
      model: ${DAMAI_AI_RERANK_MODEL:qwen3-rerank}
      api-url: ${DAMAI_AI_RERANK_API_URL:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
      top-n: ${DAMAI_AI_RERANK_TOP_N:10}
      api-key: ${DAMAI_AI_RERANK_API_KEY:${DAMAI_AI_EMBEDDING_API_KEY:${DAMAI_AI_ALIBABA_API_KEY:}}}
      cross-encoder:
        enabled: ${DAMAI_AI_CROSS_ENCODER_ENABLED:false}
        api-url: ${DAMAI_AI_CROSS_ENCODER_API_URL:}
        model: ${DAMAI_AI_CROSS_ENCODER_MODEL:bge-reranker-v2-m3}
    prometheus:
      url: ${DAMAI_AI_PROMETHEUS_URL:http://127.0.0.1:9090}
    qdrant:
      url: ${DAMAI_AI_QDRANT_URL:http://127.0.0.1:16333}
      grpc-host: ${DAMAI_AI_QDRANT_GRPC_HOST:127.0.0.1}
      grpc-port: ${DAMAI_AI_QDRANT_GRPC_PORT:16334}
      collection: ${DAMAI_AI_QDRANT_COLLECTION:damai_ai_faq}
      alias: ${DAMAI_AI_QDRANT_ALIAS:damai-ai-faq-alias}
    nl2sql:
      enabled: ${DAMAI_AI_NL2SQL_ENABLED:false}
      schema-collection: ${DAMAI_AI_NL2SQL_SCHEMA_COLLECTION:damai_ai_nl2sql_schema}
      max-rows: ${DAMAI_AI_NL2SQL_MAX_ROWS:100}
      schema-top-k: ${DAMAI_AI_NL2SQL_SCHEMA_TOP_K:5}
      query-timeout-ms: ${DAMAI_AI_NL2SQL_QUERY_TIMEOUT_MS:5000}
      repair-attempts: ${DAMAI_AI_NL2SQL_REPAIR_ATTEMPTS:1}
      min-sql-confidence: ${DAMAI_AI_NL2SQL_MIN_CONFIDENCE:0.5}
      context-ttl-minutes: ${DAMAI_AI_NL2SQL_CONTEXT_TTL_MINUTES:60}
      context-max-sessions: ${DAMAI_AI_NL2SQL_CONTEXT_MAX_SESSIONS:10000}
      cost-guard:
        enabled: ${DAMAI_AI_NL2SQL_COST_GUARD_ENABLED:true}
        require-read-only-connection: ${DAMAI_AI_NL2SQL_REQUIRE_READ_ONLY_CONNECTION:true}
        explain-timeout-ms: ${DAMAI_AI_NL2SQL_EXPLAIN_TIMEOUT_MS:2000}
        max-estimated-rows: ${DAMAI_AI_NL2SQL_MAX_ESTIMATED_ROWS:10000}
        max-query-cost: ${DAMAI_AI_NL2SQL_MAX_QUERY_COST:100000}
        fail-closed-on-explain-error: ${DAMAI_AI_NL2SQL_FAIL_CLOSED_ON_EXPLAIN_ERROR:false}
      datasource:
        driver-class-name: ${DAMAI_AI_NL2SQL_DRIVER:com.mysql.cj.jdbc.Driver}
        url: ${DAMAI_AI_NL2SQL_URL:}
        username: ${DAMAI_AI_NL2SQL_USERNAME:}
        password: ${DAMAI_AI_NL2SQL_PASSWORD:}
    faq:
      alias: ${DAMAI_AI_FAQ_ALIAS:damai-ai-faq-current}
      match-threshold: ${DAMAI_AI_FAQ_MATCH_THRESHOLD:0.92}
      keyword-match-enabled: ${DAMAI_AI_FAQ_KEYWORD_MATCH_ENABLED:true}
      semantic-match-enabled: ${DAMAI_AI_FAQ_SEMANTIC_MATCH_ENABLED:true}
    rag:
      document-pattern: ${DAMAI_AI_RAG_DOCUMENT_PATTERN:classpath:datum/*.md}
      chunk-size: ${DAMAI_AI_RAG_CHUNK_SIZE:200}
      min-chunk-size-chars: ${DAMAI_AI_RAG_MIN_CHUNK_SIZE_CHARS:50}
      min-chunk-length-to-embed: ${DAMAI_AI_RAG_MIN_CHUNK_LENGTH_TO_EMBED:5}
      max-num-chunks: ${DAMAI_AI_RAG_MAX_NUM_CHUNKS:10000}
      min-doc-length-for-token-split: ${DAMAI_AI_RAG_MIN_DOC_LENGTH_FOR_TOKEN_SPLIT:1000}
      expiration-cron: ${DAMAI_AI_RAG_EXPIRATION_CRON:0 0 3 * * ?}
      ingestion:
        mq:
          exchange: ${DAMAI_AI_RAG_INGESTION_EXCHANGE:damai.ai.rag.topic}
          queue: ${DAMAI_AI_RAG_INGESTION_QUEUE:damai.ai.rag.ingestion.q}
          routing-key: ${DAMAI_AI_RAG_INGESTION_ROUTING_KEY:rag.ingestion.request}
          dlq: ${DAMAI_AI_RAG_INGESTION_DLQ:damai.ai.rag.ingestion.dlq}
    retrieval:
      min-vector-similarity: ${DAMAI_AI_RETRIEVAL_MIN_VECTOR_SIMILARITY:0.45}
      keyword-relative-score-floor: ${DAMAI_AI_RETRIEVAL_KEYWORD_RELATIVE_SCORE_FLOOR:0.35}
      rrf-k: ${DAMAI_AI_RETRIEVAL_RRF_K:60}
      candidate-multiplier: ${DAMAI_AI_RETRIEVAL_CANDIDATE_MULTIPLIER:5}
      post-filter:
        enabled: ${DAMAI_AI_POST_FILTER_ENABLED:true}
        relevance-threshold: ${DAMAI_AI_POST_FILTER_THRESHOLD:0.35}
        min-docs-to-keep: ${DAMAI_AI_POST_FILTER_MIN_DOCS:2}
      sentence-window:
        enabled: ${DAMAI_AI_SENTENCE_WINDOW_ENABLED:true}
        window-size: ${DAMAI_AI_SENTENCE_WINDOW_SIZE:2}
      parent-elevation-enabled: ${DAMAI_AI_RETRIEVAL_PARENT_ELEVATION_ENABLED:false}
    notification:
      mq:
        exchange: ${DAMAI_AI_NOTIFICATION_EXCHANGE:damai.ai.notification.topic}
        queue: ${DAMAI_AI_NOTIFICATION_QUEUE:damai.ai.notification.q}
        routing-key: ${DAMAI_AI_NOTIFICATION_ROUTING_KEY:notification.#}
    sentiment:
      negative-escalation-threshold: ${DAMAI_AI_SENTIMENT_NEGATIVE_THRESHOLD:0.7}
      negative-streak-threshold: ${DAMAI_AI_SENTIMENT_STREAK_THRESHOLD:3}
    memory:
      structured:
        enabled: ${DAMAI_AI_STRUCTURED_MEMORY_ENABLED:true}
        stable-fact-limit: ${DAMAI_AI_STRUCTURED_MEMORY_STABLE_FACT_LIMIT:6}
        pending-question-limit: ${DAMAI_AI_STRUCTURED_MEMORY_PENDING_LIMIT:4}
        retrieval-hint-limit: ${DAMAI_AI_STRUCTURED_MEMORY_HINT_LIMIT:6}
      mq:
        exchange: ${DAMAI_AI_MEMORY_EXCHANGE:damai.ai.memory.topic}
        run-completed-queue: ${DAMAI_AI_MEMORY_RUN_COMPLETED_QUEUE:damai.ai.memory.run_completed.q}
        run-completed-routing-key: ${DAMAI_AI_MEMORY_RUN_COMPLETED_ROUTING_KEY:ai.run.completed}
        run-completed-dlq: ${DAMAI_AI_MEMORY_RUN_COMPLETED_DLQ:damai.ai.memory.run_completed.dlq}
      overflow:
        exchange: ${DAMAI_AI_OVERFLOW_EXCHANGE:damai.ai.overflow.topic}
        queue: ${DAMAI_AI_OVERFLOW_QUEUE:damai.ai.overflow.run_request.q}
        routing-key: ${DAMAI_AI_OVERFLOW_ROUTING_KEY:ai.run.request.overflow}
        dlq: ${DAMAI_AI_OVERFLOW_DLQ:damai.ai.overflow.run_request.dlq}
        message-ttl-ms: ${DAMAI_AI_OVERFLOW_TTL_MS:300000}
        max-length: ${DAMAI_AI_OVERFLOW_MAX_LENGTH:10000}
    runtime-lease:
      enabled: ${DAMAI_AI_RUNTIME_LEASE_ENABLED:true}
      fail-open: ${DAMAI_AI_RUNTIME_LEASE_FAIL_OPEN:true}
      key-prefix: ${DAMAI_AI_RUNTIME_LEASE_PREFIX:damai:ai:runtime:lease:}
      ttl-ms: ${DAMAI_AI_RUNTIME_LEASE_TTL_MS:45000}
      acquire-timeout-ms: ${DAMAI_AI_RUNTIME_LEASE_ACQUIRE_TIMEOUT_MS:120000}
      retry-interval-ms: ${DAMAI_AI_RUNTIME_LEASE_RETRY_INTERVAL_MS:1000}
    knowledge-routing:
      shadow-enabled: ${DAMAI_AI_KNOWLEDGE_ROUTE_SHADOW_ENABLED:true}
      max-scopes: ${DAMAI_AI_KNOWLEDGE_ROUTE_MAX_SCOPES:3}
      max-topics: ${DAMAI_AI_KNOWLEDGE_ROUTE_MAX_TOPICS:5}
      max-documents: ${DAMAI_AI_KNOWLEDGE_ROUTE_MAX_DOCUMENTS:5}
      min-score: ${DAMAI_AI_KNOWLEDGE_ROUTE_MIN_SCORE:1.0}
    intent:
      ambiguity-margin: ${DAMAI_AI_INTENT_AMBIGUITY_MARGIN:0.20}
      min-score: ${DAMAI_AI_INTENT_MIN_SCORE:0.4}
      max-count: ${DAMAI_AI_INTENT_MAX_COUNT:3}
    tracing:
      enabled: ${DAMAI_AI_TRACING_ENABLED:true}
      otlp-endpoint: ${DAMAI_AI_OTLP_ENDPOINT:http://127.0.0.1:4317}
      service-name: ${DAMAI_AI_TRACING_SERVICE_NAME:damai-ai}
      log-exporter-enabled: ${DAMAI_AI_TRACING_LOG_ENABLED:true}
    guardrails:
      enabled: ${DAMAI_AI_GUARDRAILS_ENABLED:true}
      pii-enabled: ${DAMAI_AI_GUARDRAILS_PII_ENABLED:true}
      hallucination-enabled: ${DAMAI_AI_GUARDRAILS_HALLUCINATION_ENABLED:true}
      toxicity-enabled: ${DAMAI_AI_GUARDRAILS_TOXICITY_ENABLED:true}
      block-on-pii: ${DAMAI_AI_GUARDRAILS_BLOCK_ON_PII:true}
      prompt-injection-enabled: ${DAMAI_AI_GUARDRAILS_PROMPT_INJECTION_ENABLED:true}
      block-on-prompt-injection: ${DAMAI_AI_GUARDRAILS_BLOCK_ON_PROMPT_INJECTION:true}
      buffer-high-risk-streaming: ${DAMAI_AI_GUARDRAILS_BUFFER_HIGH_RISK_STREAMING:true}
    agent-loop:
      enabled: ${DAMAI_AI_AGENT_LOOP_ENABLED:true}
      max-steps: ${DAMAI_AI_AGENT_LOOP_MAX_STEPS:5}
      step-timeout-ms: ${DAMAI_AI_AGENT_LOOP_STEP_TIMEOUT_MS:30000}
    llm-fallback:
      primary-model: ${DAMAI_AI_LLM_PRIMARY_MODEL:deepseek-v4-pro}
      fallback-model: ${DAMAI_AI_LLM_FALLBACK_MODEL:deepseek-chat}
      timeout-ms: ${DAMAI_AI_LLM_TIMEOUT_MS:15000}
    retry:
      max-retries: ${DAMAI_AI_RETRY_MAX:1}
      retryable-on-timeout: ${DAMAI_AI_RETRY_ON_TIMEOUT:true}
    drift-detection:
      enabled: ${DAMAI_AI_DRIFT_DETECTION_ENABLED:false}
      sample-rate: ${DAMAI_AI_DRIFT_SAMPLE_RATE:0.05}
      cron: ${DAMAI_AI_DRIFT_CRON:0 0 3 * * ?}
    cache:
      embedding:
        enabled: true
        max-size: 5000
        ttl-minutes: 30
        redis-persistence-enabled: ${DAMAI_AI_EMBEDDING_REDIS_PERSIST:false}
        redis-key-prefix: ${DAMAI_AI_EMBEDDING_REDIS_PREFIX:damai:cache:embed:}
      faq-search:
        enabled: true
        ttl-minutes: 15
      web-search:
        enabled: true
        ttl-minutes: 5
      user-context:
        enabled: true
        ttl-minutes: 10
      nl2sql-schema:
        enabled: true
        max-size: 100
        ttl-minutes: 60
      nl2sql-result:
        enabled: true
        ttl-minutes: 3
    rate-limit:
      enabled: true
      endpoints:
        "assistant.runs.create":
          limit: 20
          window-seconds: 60
          key-type: user
        "assistant.runs.stream":
          limit: 10
          window-seconds: 0
          key-type: user
        admin:
          limit: 50
          window-seconds: 60
          key-type: user
    sentinel:
      llm:
        enabled: true
        resource-name: ai.llm.primary
        degrade:
          enabled: true
          grade: slow_request_ratio
          slow-request-threshold-ms: 15000
          slow-ratio-threshold: 0.8
          min-request-amount: 20
          stat-interval-ms: 10000
          time-window-seconds: 30
        flow:
          enabled: true
          grade: qps
          count: 100
      qdrant:
        enabled: true
        resource-name: ai.rag.qdrant
        degrade:
          enabled: true
          grade: exception_ratio
          exception-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-seconds: 15
        flow:
          enabled: true
          grade: qps
          count: 120
      es:
        enabled: true
        resource-name: ai.rag.elasticsearch
        degrade:
          enabled: true
          grade: exception_ratio
          exception-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-seconds: 15
        flow:
          enabled: true
          grade: qps
          count: 120
      web-search:
        enabled: true
        resource-name: ai.web-search
        degrade:
          enabled: true
          grade: exception_ratio
          exception-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-seconds: 30
        flow:
          enabled: true
          grade: qps
          count: 50
      user-service:
        enabled: true
        resource-name: ai.user-service
        degrade:
          enabled: true
          grade: exception_ratio
          exception-ratio: 0.5
          min-request-amount: 10
          stat-interval-ms: 10000
          time-window-seconds: 30
        flow:
          enabled: true
          grade: qps
          count: 100
    thread-pool:
      assistant:
        core-pool-size: 16
        max-pool-size: 64
        queue-capacity: 500
        keep-alive-seconds: 60
        overflow-threshold: 0.8
      nl2sql:
        max-pool-size: 5
        connection-timeout-ms: 3000
        idle-timeout-ms: 600000
        max-lifetime-ms: 1800000
# AI可观测性配置 - 模型价格（单位：元/1K tokens）
# 参考价格，请以各厂商官网为准
ai:
  observability:
    pricing:
      deepseek-chat:
        input: 0.001
        output: 0.002
      qwen3.6-plus:
        input: 0.004
        output: 0.012
      qwen3-rerank:
        input: 0.002
        output: 0.0
      gpt-4:
        input: 0.21
        output: 0.42
      "[gpt-3.5-turbo]":
        input: 0.0035
        output: 0.014
